repos:
    - repo: local
      hooks:
          - id: csharpier
            name: csharpier
            entry: dotnet csharpier check
            language: system
            files: \.cs$
            stages:
                - pre-commit
                - pre-push

          # Both checkers live in the parent repo, not here: this mod repo sits
          # inside it and already reaches for ../utils/ to build and link. Each
          # takes this repo's root, so the scope is `git ls-files` here.
          #
          # The parent is SEARCHED FOR rather than spelled `..`, because `..` is
          # only the parent when the repo sits directly under it. CLAUDE.md
          # requires the work to happen in a worktree at <mod>/.worktrees/<branch>,
          # where `..` is .worktrees/, so the hook aborted before the checker ran:
          # every documentation commit made from a worktree failed with a spawn
          # error rather than being examined. Loud, not silent — which is what
          # made it survivable, and also what made it look like a gate doing its
          # job. Walking up finds the same directory from either place.
          - id: docs-links
            name: docs links
            entry: bash -c 'd=$PWD; while [ "$d" != / ] && [ ! -e "$d/utils/check_docs_links.py" ]; do d=$(dirname "$d"); done; exec uv run --frozen --project "$d" "$d/utils/check_docs_links.py" .'
            language: system
            pass_filenames: false
            files: \.md$
            stages:
                - pre-commit
                - pre-push

          - id: docs-wrapping
            name: docs wrapping
            entry: bash -c 'd=$PWD; while [ "$d" != / ] && [ ! -e "$d/utils/check_docs_wrapping.py" ]; do d=$(dirname "$d"); done; exec uv run --frozen --project "$d" "$d/utils/check_docs_wrapping.py" .'
            language: system
            pass_filenames: false
            files: \.md$
            stages:
                - pre-commit
                - pre-push

          # The atlas, the kerning matrix and the hand-pasted Widths constant
          # must all come from the same revision of the Pixaki master, and
          # nothing else in the build compares them. The guard is a test in the
          # parent repo, where the generator lives, so this hook reaches across
          # the repo boundary — and says so out loud when the parent is not
          # there, which is the normal case for a standalone clone of this mod.
          - id: artifacts-match-master
            name: font artifacts match the Pixaki master
            entry: >-
                bash -c 'if [ -d ../utils/tests ]; then (cd .. && exec uv run --frozen
                pytest utils/tests/test_shipped_artifacts.py -q); else echo "SKIPPED:
                ../utils is absent (standalone clone), so the atlas/kerning/Widths
                consistency guard did NOT run"; fi'
            language: system
            pass_filenames: false
            files: ^(unity/CompleteTinyFont/Art/thinTiny_|unity/CompleteTinyFont/ThinTinyFontPatch\.cs|sources/thinTiny\.pixaki)
            stages:
                - pre-commit
                - pre-push
